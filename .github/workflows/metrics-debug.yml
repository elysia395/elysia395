name: Metrics debug test

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  minimal:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Minimal header-only test
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: elysia395
          filename: metrics.test.svg
          committer_branch: output
          base: header
          config_timezone: Asia/Shanghai
          debug: yes
